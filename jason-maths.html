<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jason's Maths Practice</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#24354b;background:#f5f8ff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:850px;margin:auto;padding:24px 16px 70px}.card{background:white;border:1px solid #e3eaf4;border-radius:16px;padding:22px;margin:18px 0}h1{margin-bottom:5px}p{line-height:1.6}.muted{color:#5c6d81}.q{border-top:1px solid #e5eaf2;padding:20px 0}.q:first-child{border:0}.q strong{font-size:1.05em}.option{display:block;padding:9px;margin:7px 0;border:1px solid #dce4ee;border-radius:9px;cursor:pointer}.option:has(input:checked){background:#eaf2ff;border-color:#5b85c5}select{font:inherit;padding:9px;border:1px solid #9ab2d2;border-radius:9px} .clock{font-size:2.5rem;font-weight:800;font-variant-numeric:tabular-nums;color:#285bb0}.clock.urgent{color:#b33b31}button{font:inherit;padding:12px 18px;border-radius:10px;border:1px solid #9ab2d2;background:#e8f1ff;cursor:pointer}button:disabled{opacity:.5}a{color:#285bb0}.status{font-weight:650;color:#285b4a}.small{font-size:.9em}details{margin-top:16px}summary{cursor:pointer;font-weight:650}@media print{button,.no-print{display:none!important}.card{break-inside:avoid}}</style></head><body><main class="wrap"><a href="./jason.html">← Jason's roadmap</a><h1>🧮 Jason's Maths Mission</h1><p class="muted">Two-week accuracy challenge · First attempt → Independent check → Results</p><div class="card"><h2>🎯 Your two-week plan</h2><p id="plan"></p><label for="week">Choose your practice week: </label><select id="week" onchange="chooseWeek()"><option value="1">Week 1 · Accuracy (8 questions)</option><option value="2">Week 2 · Pacing & skipping (10 questions)</option></select><p class="muted small">A fresh set is selected each session. Your previous results stay saved on this device.</p><button id="start" onclick="startSession()">▶ Start a new practice</button><p id="history" class="muted small"></p><button type="button" id="reset-test" onclick="resetTest()" style="background:#fff5f3;border-color:#d7a6a0">🗑️ Clear test practice record</button></div><div class="card" id="practice" hidden><h2 id="phaseTitle"></h2><div class="clock" id="clock" aria-live="off">00:00</div><p id="instructions"></p><div id="questions"></div><button id="next" onclick="nextPhase()"></button><p id="result" class="status" aria-live="polite"></p></div><details class="card" id="parentBox" hidden><summary>🔒 Parent answer key and explanations</summary><div id="parent"></div></details></main><script>
const data=[
{topic:"Time",q:"A train leaves at 11:35 pm on Friday and arrives at 1:20 pm on Saturday. How long is the journey?",o:["1 hour 45 minutes","11 hours 45 minutes","13 hours 45 minutes","14 hours 15 minutes","25 hours 45 minutes"],a:2,why:"25 minutes to midnight, then 13 hours 20 minutes = 13 hours 45 minutes."},
{topic:"Rounding",q:"Which number changes the most when rounded to the nearest ten?",o:["64","75","82","98","40"],a:1,why:"75 rounds to 80, a change of 5. The others change by 4, 2, 2 and 0."},
{topic:"Directions",q:"Mia walks 50 metres north, 30 metres east, 20 metres south and 30 metres west. How far is she from her starting point?",o:["0 m","20 m","30 m","50 m","130 m"],a:2,why:"East and west cancel. 50 m north minus 20 m south leaves 30 m north."},
{topic:"Patterns",q:"A bracelet repeats this pattern: 3 green beads followed by 2 yellow beads. If there are 18 green beads, how many yellow beads are there?",o:["8","10","12","15","20"],a:2,why:"18 ÷ 3 = 6 repeats, each with 2 yellow beads: 6 × 2 = 12."},
{topic:"Capacity",q:"Jug A contains 45 mL of water. Jug B contains 65 mL. Water is poured from A into B until B has 90 mL. How much is left in A?",o:["10 mL","15 mL","20 mL","25 mL","30 mL"],a:2,why:"B needs 90 − 65 = 25 mL. A has 45 − 25 = 20 mL left."},
{topic:"Right angles",q:"A rectangle has four right angles. A straight line is drawn across its middle, from the midpoint of its top edge to the midpoint of its bottom edge. How many right angles are formed in total by the outline and the new line?",o:["4","6","8","10","12"],a:2,why:"Four corners plus two right angles at each of the two meeting points = 8."},
{topic:"3D shapes",q:"Twelve identical cubes are glued into a solid block that is 3 cubes long, 2 cubes wide and 2 cubes high. How many individual small-square faces are hidden inside the block?",o:["12","20","24","28","36"],a:3,why:"There are (3−1)×2×2 + 3×(2−1)×2 + 3×2×(2−1) = 8+6+6 = 20 touching pairs. Each pair hides 2 faces, so 40. Correction: 40 hidden faces."},
{topic:"Sequences",q:"Each number in a sequence is 3 less than twice the previous number. The next number is 41. What was the previous number?",o:["19","20","21","22","23"],a:3,why:"2 × previous − 3 = 41, so previous = (41 + 3) ÷ 2 = 22."},
{topic:"Dates",q:"If 6 June is a Monday, what day of the week is 27 June of the same year?",o:["Monday","Tuesday","Wednesday","Sunday","Friday"],a:0,why:"27 − 6 = 21 days = exactly three weeks, so it is Monday."},
{topic:"Folded paper",q:"A square sheet is 8 cm by 8 cm. It is folded in half, then in half again, making four layers. A 2 cm by 2 cm square is cut through all four layers. What area of paper remains after unfolding?",o:["16 cm²","32 cm²","40 cm²","48 cm²","60 cm²"],a:3,why:"Original area 64 cm². Cut 4 cm² through four layers = 16 cm² removed. Remaining 48 cm²."},
{topic:"Reading a scale",q:"A measuring jug has marks at 20, 30, 40 and 50 mL, with one equally spaced smaller mark halfway between each pair. The water reaches the small mark between 30 and 40. How much water is in the jug?",o:["30 mL","32 mL","35 mL","38 mL","40 mL"],a:2,why:"Halfway between 30 and 40 is 35 mL."},
{topic:"Time",q:"A movie starts at 2:45 pm and lasts 1 hour 50 minutes. At what time does it finish?",o:["3:35 pm","4:25 pm","4:35 pm","4:45 pm","5:05 pm"],a:2,why:"2:45 pm + 1 hour = 3:45 pm; + 50 minutes = 4:35 pm."}
];
data[6].o=["12","20","24","40","48"];data[6].a=3;data[6].why="There are 8 + 6 + 6 = 20 pairs of touching cubes. Each pair hides two faces, so 40 faces are hidden.";

const KEY="jason-maths-two-weeks-v1";let store={history:[],session:null};try{store={...store,...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch(e){};let timer=null;const $=id=>document.getElementById(id);
function persist(){localStorage.setItem(KEY,JSON.stringify(store))}
function plan(){const w=+$("week").value;$("plan").textContent=w===1?"Week 1: 8 mixed questions · 15 minutes to solve · 3 minutes to check independently. Focus on first-time accuracy.":"Week 2: 10 mixed questions · 18 minutes to solve · 3 minutes to check independently. Mark difficult questions and return later.";renderHistory()}
function chooseWeek(){if(store.session&&store.session.phase!=="done")return;plan()}
function renderHistory(){const h=store.history||[];$("history").textContent=h.length?"Previous sessions: "+h.slice(-5).map(x=>"Week "+x.week+" · "+x.first+"/"+x.total+" first → "+x.checked+"/"+x.total+" checked").join(" | "):"No completed sessions yet."}
function startSession(){if(store.session&&store.session.phase!=="done"&&!confirm("Replace your unfinished practice?"))return;const week=+$("week").value,n=week===1?8:10;const used=(store.history||[]).length;const order=data.map((_,i)=>i);const offset=(used*5)%data.length;const ids=Array.from({length:n},(_,i)=>order[(offset+i)%data.length]);store.session={week,ids,phase:"solve",answers:{},first:null,flagged:{},deadline:Date.now()+(week===1?15:18)*60000};persist();render()}
function resetTest(){if(!confirm("Clear ALL Jason Maths practice records on this device, including the current attempt? Reading progress will not be affected."))return;clearInterval(timer);localStorage.removeItem(KEY);localStorage.removeItem("jason-maths-targeted-v1");store={history:[],session:null};$("week").value="1";$("parentBox").hidden=true;render();}
function selected(){return store.session.ids}
function drawQuestions(){const session=store.session;const root=$("questions");root.innerHTML="";selected().forEach((id,i)=>{const x=data[id],d=document.createElement("section");d.className="q";const title=document.createElement("strong");title.textContent="Question "+(i+1)+" · "+x.topic;d.append(title);const p=document.createElement("p");p.textContent=x.q;d.append(p);x.o.forEach((v,j)=>{const lab=document.createElement("label");lab.className="option";const input=document.createElement("input");input.type="radio";input.name="q"+id;input.value=j;input.checked=session.answers[id]===j;input.disabled=session.phase==="done";input.onchange=()=>{session.answers[id]=j;persist()};lab.append(input,document.createTextNode(" "+String.fromCharCode(65+j)+". "+v));d.append(lab)});if(session.week===2&&session.phase==="solve"){const lab=document.createElement("label");const cb=document.createElement("input");cb.type="checkbox";cb.checked=!!session.flagged[id];cb.onchange=()=>{session.flagged[id]=cb.checked;persist()};lab.append(cb,document.createTextNode(" ⭐ Come back to this question"));d.append(lab)}root.append(d)})}
function render(){clearInterval(timer);const s=store.session;$("practice").hidden=!s;$("start").textContent=s&&s.phase!=="done"?"↻ Start over":"▶ Start a new practice";$("week").disabled=!!s&&s.phase!=="done";if(!s){plan();return}$("week").value=s.week;plan();$("phaseTitle").textContent=s.phase==="solve"?"✏️ Round 1 · Solve independently":s.phase==="check"?"🔎 Round 2 · Find your own mistakes":"🏁 Practice complete";$("instructions").textContent=s.phase==="solve"?"Work through the questions. Do not worry if one is difficult — move on and come back.":s.phase==="check"?"Check EVERY answer yourself. You will not be told which questions are wrong. Check units, question wording and calculations.":"Review your first-attempt and checked scores below.";drawQuestions();$("next").hidden=s.phase==="done";$("next").textContent=s.phase==="solve"?"Start independent check →": "Finish and see results";$("parentBox").hidden=s.phase!=="done";$("result").textContent="";if(s.phase==="done"){const first=s.ids.filter(id=>s.first[id]===data[id].a).length,checked=s.ids.filter(id=>s.answers[id]===data[id].a).length;$("result").textContent="First attempt: "+first+"/"+s.ids.length+" · After self-check: "+checked+"/"+s.ids.length+" · "+(checked-first)+" improved";$("parent").innerHTML=s.ids.map((id,i)=>"<p><b>Q"+(i+1)+": "+String.fromCharCode(65+data[id].a)+"</b> — "+data[id].why+"</p>").join("");$("clock").textContent="Finished";return}tick();timer=setInterval(tick,1000)}
function tick(){const s=store.session;if(!s||s.phase==="done"){clearInterval(timer);return}const remain=Math.max(0,Math.ceil((s.deadline-Date.now())/1000));$("clock").textContent=String(Math.floor(remain/60)).padStart(2,"0")+":"+String(remain%60).padStart(2,"0");$("clock").classList.toggle("urgent",remain<=60);if(remain===0){clearInterval(timer);nextPhase(true)}}
function nextPhase(auto=false){const s=store.session;if(!s||s.phase==="done")return;if(s.phase==="solve"){s.first={...s.answers};s.phase="check";s.deadline=Date.now()+3*60000}else{s.phase="done";const first=s.ids.filter(id=>s.first[id]===data[id].a).length,checked=s.ids.filter(id=>s.answers[id]===data[id].a).length;store.history=store.history||[];store.history.push({week:s.week,total:s.ids.length,first,checked,at:new Date().toISOString()})}persist();render()}
$("week").value=store.session?.week||1;render();
</script></body></html>
