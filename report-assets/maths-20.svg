<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 125" role="img" aria-label="An old ruler with marks only at zero, two, three and seven centimetres. The gap between two and three is one centimetre."><style>text{font-family:system-ui,sans-serif;fill:#24354b;font-size:18px}polygon,line,path,rect,circle{vector-effect:non-scaling-stroke}</style><rect x="25" y="45" width="365" height="62" fill="#e1e6ec" stroke="#65758a"/><line x1="45" y1="48" x2="45" y2="86" stroke="#344256" /><text x="45" y="102" text-anchor="middle">0 cm</text><line x1="135" y1="48" x2="135" y2="86" stroke="#344256" /><text x="135" y="102" text-anchor="middle">2</text><line x1="180" y1="48" x2="180" y2="86" stroke="#344256" /><text x="180" y="102" text-anchor="middle">3</text><line x1="360" y1="48" x2="360" y2="86" stroke="#344256" /><text x="360" y="102" text-anchor="middle">7</text><line x1="135" y1="29" x2="180" y2="29" stroke="#344256" /><polygon points="135,29 142,25 142,33" fill="#344256" stroke="#344256" stroke-width="1.5"/><polygon points="180,29 173,25 173,33" fill="#344256" stroke="#344256" stroke-width="1.5"/><text x="157" y="20" text-anchor="middle">1 cm</text></svg>