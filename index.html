<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emily's Little Learning Adventure</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#263548;background:#fff8ed}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:22px 16px 55px}
header{text-align:center;padding:20px 8px}h1{font-size:clamp(26px,6vw,38px);margin:5px}h2{font-size:21px}
.subtitle{color:#576579}.tabs{display:flex;gap:10px;margin:20px 0}
button{font:inherit;cursor:pointer;border-radius:13px;padding:12px 18px;border:2px solid #d8dfe9;background:white;color:#263548}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #ec9c37;outline-offset:2px}
.tab{flex:1;font-weight:750}.tab.active{background:#d9f3e4;border-color:#39976e}
.panel{background:white;border:1px solid #e6e5e0;border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 5px 15px #3e35280a}
.story{background:#eff8ed;line-height:1.8;font-size:18px}.story .plant{text-align:center;font-size:60px}
.q{margin:16px 0;padding:18px;border:1px solid #e0e6e8;border-radius:17px;background:white}
.q strong{font-size:18px}.choices{display:grid;gap:9px;margin:14px 0}
.choice{display:flex;align-items:center;gap:12px;padding:12px;border:2px solid #e1e7ee;border-radius:12px;cursor:pointer}
.choice:has(input:checked){border-color:#39976e;background:#edf9f1}
.choice input{width:20px;height:20px;accent-color:#21865d}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.check{background:#228d64;color:white;border-color:#228d64;font-weight:700}.check:disabled{opacity:.5;cursor:not-allowed}
.hint,.feedback{padding:12px;margin-top:12px;border-radius:12px;background:#fff5d8}
.feedback{background:#e8f6ec}.feedback.retry{background:#fff0df}
textarea{width:100%;min-height:82px;border-radius:12px;border:2px solid #d8dfe9;padding:12px;font:inherit;font-size:17px}
.progress{height:10px;border-radius:12px;background:#e9ecef;overflow:hidden}.fill{height:100%;background:#54ae7e;transition:width .2s}
.end{text-align:center;font-size:21px;background:#e8f6ec;padding:22px;border-radius:16px}
footer{text-align:center;color:#667085;font-size:13px;margin-top:28px}
@media print{body{background:white}.tabs,.actions,footer{display:none}.panel,.q{box-shadow:none;break-inside:avoid}}
</style></head>
<body><main class="wrap"><header><div style="font-size:52px">🌻📚🔢</div><h1>Emily's Little Learning Adventure</h1><div class="subtitle">English + Maths • NSW Year 1 • No timer, no scores!</div></header>
<nav class="tabs"><button class="tab active" data-tab="english">📖 English</button><button class="tab" data-tab="maths">🔢 Maths</button></nav>
<section id="intro"></section><div class="panel"><div id="progresslabel"></div><div class="progress"><div class="fill" id="progressbar"></div></div></div>
<p id="savestatus" role="status" aria-live="polite"></p>
<div id="questions"></div><div id="finish"></div>
<footer>Take your time. Ask for help whenever you like. Your answers stay on this device.</footer></main>
<script src="persistence.js"></script>
<script>
const data={
english:[
{id:'e1',q:'What did Mia plant?',choices:['A flower','A tiny seed','A big tree'],correct:1,hint:'Look at the first sentence.',why:'Mia planted a tiny seed in a pot.'},
{id:'e2',q:'What did Mia give the seed?',choices:['Water','Ice cream','Sand'],correct:0,hint:'What do growing plants need?',why:'She gave it water.'},
{id:'e3',q:'What appeared after a few days?',choices:['A little green shoot','A red apple','A butterfly'],correct:0,hint:'Read the end of the story again.',why:'A little green shoot popped up.'},
{id:'e4',q:'Which sentence is written correctly?',choices:['the plant is green.','The plant is green.','The plant is green'],correct:1,hint:'Look for a capital letter and a full stop.',why:'Sentences begin with a capital letter and end with punctuation.'},
{id:'e5',q:'Write one sentence about a plant you would like to grow.',writing:true,hint:'You could start with: I would grow...'}],
maths:[
{id:'m1',q:'6 + 3 = ?',choices:['8','9','10'],correct:1,hint:'Start at 6 and count three more.',why:'6 + 3 = 9.'},
{id:'m2',q:'12 − 2 = ?',choices:['9','10','11'],correct:1,hint:'Count backwards twice from 12.',why:'12 − 2 = 10.'},
{id:'m3',q:'What comes next? 2, 4, 6, 8, ...',choices:['9','10','12'],correct:1,hint:'Each number grows by 2.',why:'8 + 2 = 10.'},
{id:'m4',q:'Which number is bigger?',choices:['14','17','They are equal'],correct:1,hint:'Which number comes later when counting?',why:'17 is bigger than 14.'},
{id:'m5',q:'A pencil costs 5 cents. A sticker costs 3 cents. How much altogether?',choices:['7 cents','8 cents','9 cents'],correct:1,hint:'Add 5 and 3.',why:'5 + 3 = 8 cents.'}]
};
const persistence=AdventurePersistence.createPersistence(()=>window.localStorage,Object.values(data).flat());
const restored=persistence.load();
let tab=restored.tab;
const state=restored.answers;
function showSaveStatus(result){
const el=document.getElementById('savestatus');
el.textContent=result.ok?'Progress saved on this device.':result.reason==='invalid'?'Saved progress could not be read. Your next answer will start a new save.':'Progress is only kept while this page is open. This browser could not save it.';
}
function save(){showSaveStatus(persistence.save(state,tab))}
showSaveStatus(restored);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){
document.querySelectorAll('.tab').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-pressed',b.dataset.tab===tab)});
document.getElementById('intro').innerHTML=tab==='english'?'<div class="panel story"><div class="plant" aria-hidden="true">🌱☀️</div><h2>🌿 Mia’s Tiny Seed</h2><p>Mia planted a tiny seed in a pot. She gave it water and put it by the window. Every morning, Mia looked at the soil. After a few days, a little green shoot popped up. Mia smiled.</p></div>':'<div class="panel story"><h2>✨ Let’s play with numbers!</h2><p>You can use your fingers, draw dots, or use little toys to help you.</p></div>';
const qs=data[tab];let done=qs.filter(q=>state[q.id]?.checked).length;
document.getElementById('progresslabel').textContent=`${done} of ${qs.length} activities checked`;
document.getElementById('progressbar').style.width=(100*done/qs.length)+'%';
document.getElementById('questions').innerHTML=qs.map((q,i)=>{
const s=state[q.id]||{}, checked=!!s.checked;
let entry=q.writing?`<textarea id="txt-${q.id}" placeholder="Write your sentence here..." ${checked?'disabled':''}>${esc(s.value??'')}</textarea>`:`<div class="choices">${q.choices.map((c,j)=>`<label class="choice"><input type="radio" name="${q.id}" value="${j}" ${String(s.value)===String(j)?'checked':''} ${checked?'disabled':''}><span>${esc(c)}</span></label>`).join('')}</div>`;
let fb=checked?`<div class="feedback ${!q.writing&&Number(s.value)!==q.correct?'retry':''}" role="status">${q.writing?'🌟 Lovely writing! Read it aloud and check your capital letter and full stop.':Number(s.value)===q.correct?'🎉 You got it! '+esc(q.why):'💛 Good try! '+esc(q.why)}</div>`:'';
return `<article class="q"><strong>${i+1}. ${esc(q.q)}</strong>${entry}<div class="actions">${!checked?`<button type="button" class="hintbtn" data-id="${q.id}">💡 Hint</button><button type="button" class="check" data-id="${q.id}" ${s.value===undefined||String(s.value).trim()===''?'disabled':''}>Check my answer</button>`:''}</div><div class="hint" id="hint-${q.id}" ${s.hint?'':'hidden'}>${esc(q.hint)}</div>${fb}</article>`}).join('');
document.getElementById('finish').innerHTML=done===qs.length?`<div class="end">🎉 Hooray, Emily!<p>You finished ${tab==='english'?'English':'Maths'}! Great effort!</p><button id="next">Try ${tab==='english'?'Maths':'English'} ➜</button></div>`:'';
document.querySelectorAll('.choices input').forEach(el=>el.addEventListener('change',()=>{state[el.name]={...state[el.name],value:Number(el.value)};save();render()}));
document.querySelectorAll('textarea').forEach(el=>el.addEventListener('input',()=>{let id=el.id.slice(4);state[id]={...state[id],value:el.value};save();let b=el.closest('.q').querySelector('.check');if(b)b.disabled=!el.value.trim()}));
document.querySelectorAll('.hintbtn').forEach(el=>el.addEventListener('click',()=>{let id=el.dataset.id;state[id]={...state[id],hint:!state[id]?.hint};save();let h=document.getElementById('hint-'+id);h.hidden=!state[id].hint}));
document.querySelectorAll('.check').forEach(el=>el.addEventListener('click',()=>{let id=el.dataset.id;if(state[id]?.value===undefined||String(state[id].value).trim()==='')return;state[id].checked=true;save();render()}));
const next=document.getElementById('next');if(next)next.addEventListener('click',()=>{tab=tab==='english'?'maths':'english';save();render();window.scrollTo({top:0,behavior:'smooth'})});
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;save();render()}));render();
</script></body></html>
